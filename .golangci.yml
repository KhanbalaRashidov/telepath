# golangci-lint configuration for Telepath.
run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/telepath/telepath
  gofmt:
    simplify: true

issues:
  exclude-rules:
    # Tests may ignore errors on purpose.
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
