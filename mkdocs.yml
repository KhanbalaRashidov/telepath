site_name: Telepath
site_description: A multi-agent Telegram <-> coding-agent bridge with interactive approvals and per-task git branches.
repo_url: https://github.com/KhanbalaRashidov/telepath
docs_dir: docs

# The per-page language switcher (first line of each page) uses relative
# cross-language links (e.g. ../ru/agents.md) so it also works when browsing on
# GitHub. mkdocs-static-i18n builds one language tree at a time and hides the
# other languages' files from each build, so those cross-language links can't be
# resolved during per-language link validation. In the published site, language
# switching is handled by Material's built-in language selector, so these are
# downgraded to INFO (instead of warnings) to keep `--strict` green. The same
# applies to links that point outside docs_dir (e.g. ../../CONTRIBUTING.md).
validation:
  links:
    not_found: info
    anchors: info
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Exclude the top-level GitHub-facing language hub (docs/README.md) from the
# build. In folder mode the default language (en) builds to the site root, so
# docs/en/index.md is the root index; the top-level docs/README.md (a
# README) would normalize to that same root index and conflict. The leading
# slash anchors this to docs_dir so only the top-level docs/README.md is
# excluded; the per-language index.md homes are kept and built.
exclude_docs: |
  /README.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: ru
          name: Русский
          nav_translations:
            Home: Главная
            Getting started: Начало работы
            Configuration: Конфигурация
            Telegram commands: Команды Telegram
            Agents: Агенты
            Permissions: Разрешения
            Branch workflow: Работа с ветками
            Architecture: Архитектура
            Docker: Docker
            Adding an agent: Добавление агента
            Security: Безопасность
            Troubleshooting: Устранение неполадок
            FAQ: FAQ
        - locale: tr
          name: Türkçe
          nav_translations:
            Home: Ana sayfa
            Getting started: Başlangıç
            Configuration: Yapılandırma
            Telegram commands: Telegram komutları
            Agents: Ajanlar
            Permissions: İzinler
            Branch workflow: Dal iş akışı
            Architecture: Mimari
            Docker: Docker
            Adding an agent: Ajan ekleme
            Security: Güvenlik
            Troubleshooting: Sorun giderme
            FAQ: SSS
        - locale: az
          name: Azərbaycanca
          nav_translations:
            Home: Əsas səhifə
            Getting started: Başlanğıc
            Configuration: Konfiqurasiya
            Telegram commands: Telegram əmrləri
            Agents: Agentlər
            Permissions: İcazələr
            Branch workflow: Branch iş axını
            Architecture: Arxitektura
            Docker: Docker
            Adding an agent: Agent əlavə etmək
            Security: Təhlükəsizlik
            Troubleshooting: Nasazlıqların aradan qaldırılması
            FAQ: Tez-tez verilən suallar

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

# The nav uses the default-language (en) paths; mkdocs-static-i18n maps each
# item to the matching file under ru/, tr/, az/ for the other locales.
nav:
  - Home: en/index.md
  - Getting started: en/getting-started.md
  - Configuration: en/configuration.md
  - Telegram commands: en/telegram-commands.md
  - Agents: en/agents.md
  - Permissions: en/permissions.md
  - Branch workflow: en/branch-workflow.md
  - Architecture: en/architecture.md
  - Docker: en/docker.md
  - Adding an agent: en/adding-an-agent.md
  - Security: en/security.md
  - Troubleshooting: en/troubleshooting.md
  - FAQ: en/faq.md
